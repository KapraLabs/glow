<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">One device</title>
  <desc id="desc">One device is one person's private AI. The network answers and settles.</desc>
  <rect width="960" height="360" fill="#f7f6f3"/>
  <text x="48" y="48" fill="#1c1917" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="650">One device</text>
  <text x="48" y="76" fill="#57534e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">One person. One private AI. The network answers.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="130" width="280" height="150" rx="16" fill="#ffffff" stroke="#1f4d3a" stroke-width="1.5"/>
    <text x="220" y="185" text-anchor="middle" fill="#1f4d3a" font-size="18" font-weight="650">One phone</text>
    <text x="220" y="214" text-anchor="middle" fill="#44403c" font-size="14">keys and private memory</text>
    <text x="220" y="238" text-anchor="middle" fill="#44403c" font-size="14">one person's AI</text>
    <rect x="560" y="130" width="300" height="150" rx="16" fill="#ffffff" stroke="#1c1917"/>
    <text x="710" y="185" text-anchor="middle" fill="#1c1917" font-size="18" font-weight="650">Kapra network</text>
    <text x="710" y="214" text-anchor="middle" fill="#44403c" font-size="14">answer, fee, confirmation</text>
    <text x="710" y="238" text-anchor="middle" fill="#57534e" font-size="13">private memory stays on the phone</text>
    <path d="M360 205 H560" stroke="#1c1917" stroke-width="1.5" fill="none"/>
    <path d="M552 205 l8 -5 v10 z" fill="#1c1917"/>
  </g>
</svg>
