<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Kapra and Glow together</title>
  <desc id="desc">Glow is the client. Kapra settles use, serves answers, and separates confirmation from block writing.</desc>
  <rect width="960" height="460" fill="#f7f6f3"/>
  <text x="48" y="48" fill="#1c1917" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="650">Kapra and Glow together</text>
  <text x="48" y="76" fill="#57534e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Glow is the client. Kapra is the network underneath it.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="120" width="250" height="250" rx="12" fill="#ffffff" stroke="#1f4d3a" stroke-width="1.5"/>
    <text x="173" y="160" text-anchor="middle" fill="#1f4d3a" font-size="16" font-weight="650">Glow clients</text>
    <text x="173" y="196" text-anchor="middle" fill="#44403c" font-size="14">phone</text>
    <text x="173" y="220" text-anchor="middle" fill="#44403c" font-size="14">desktop</text>
    <text x="173" y="244" text-anchor="middle" fill="#44403c" font-size="14">browser</text>
    <text x="173" y="280" text-anchor="middle" fill="#57534e" font-size="13">keys on the device</text>
    <text x="173" y="304" text-anchor="middle" fill="#57534e" font-size="13">private memory</text>
    <text x="173" y="336" text-anchor="middle" fill="#57534e" font-size="13">may confirm, never mints</text>
    <rect x="390" y="120" width="250" height="250" rx="12" fill="#ffffff" stroke="#1c1917"/>
    <text x="515" y="160" text-anchor="middle" fill="#1c1917" font-size="16" font-weight="650">Kapra network</text>
    <text x="515" y="200" text-anchor="middle" fill="#44403c" font-size="14">serves the answer</text>
    <text x="515" y="228" text-anchor="middle" fill="#44403c" font-size="14">settles $0.002</text>
    <text x="515" y="256" text-anchor="middle" fill="#44403c" font-size="14">keeps general answers</text>
    <text x="515" y="296" text-anchor="middle" fill="#57534e" font-size="13">servers write blocks</text>
    <text x="515" y="320" text-anchor="middle" fill="#57534e" font-size="13">others check and confirm</text>
    <rect x="710" y="160" width="200" height="170" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="810" y="210" text-anchor="middle" fill="#1c1917" font-size="16" font-weight="650">Person receives</text>
    <text x="810" y="242" text-anchor="middle" fill="#44403c" font-size="14">the answer</text>
    <text x="810" y="266" text-anchor="middle" fill="#44403c" font-size="14">on their device</text>
    <text x="810" y="298" text-anchor="middle" fill="#57534e" font-size="13">prompt text is not</text>
    <text x="810" y="316" text-anchor="middle" fill="#57534e" font-size="13">the public record</text>
    <path d="M298 245 H390" stroke="#1c1917" stroke-width="1.5" fill="none"/>
    <path d="M382 245 l8 -5 v10 z" fill="#1c1917"/>
    <path d="M640 245 H710" stroke="#1c1917" stroke-width="1.5" fill="none"/>
    <path d="M702 245 l8 -5 v10 z" fill="#1c1917"/>
  </g>
</svg>
